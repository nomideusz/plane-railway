[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:migrator]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-migrator.sh"
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=10

[program:space]
directory=/app/space/apps/space
# Upstream runs this through npx, which keeps a ~95 MB npm process alive for nothing.
command=/app/space/apps/space/node_modules/.bin/react-router-serve ./build/server/index.js
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3002,HOSTNAME=0.0.0.0
priority=15

[program:api]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-api.sh"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3004,HOSTNAME=0.0.0.0
priority=15

[program:worker]
directory=/app/backend
# Upstream starts one Celery process per CPU the container sees: dozens on
# Railway hosts, ~150 MB each. CELERY_WORKER_CONCURRENCY caps it (default 2).
command=sh -c "python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l info --concurrency ${CELERY_WORKER_CONCURRENCY:-2}"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

[program:beat]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-beat.sh"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

[program:live]
command=sh -c "node /app/live/apps/live"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3005,HOSTNAME=0.0.0.0
priority=20

[program:proxy]
directory=/app/proxy
command=sh -c "caddy run --config /app/proxy/Caddyfile"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

# Railway: create the instance admin from PLANE_ADMIN_EMAIL so /god-mode is
# never open to whoever finds the URL first. Exits once done; no-op after.
[program:railway-setup]
directory=/app/backend
command=sh -c "python manage.py wait_for_migrations && exec python manage.py railway_setup"
autostart=true
autorestart=unexpected
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=30
